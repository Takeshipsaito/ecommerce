<VirtualHost *:80>
    ServerAdmin webmaster@hcode.com.br
    ServerName www.hcodecommerce.com.br
    ServerAlias hcodecommerce.com.br

    DocumentRoot /home/usuario/Documentos/ecommerce/public

    <Directory /home/usuario/Documentos/ecommerce/public>
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ecommerce_error.log
    CustomLog ${APACHE_LOG_DIR}/ecommerce_access.log combined
</VirtualHost>
